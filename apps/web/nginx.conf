# nginx config for the Vite SPA bundle.
#
# Critical behaviours:
#   1. SPA fallback — any unmatched path serves /index.html so deep links
#      like /accounts/<id>/account-kit work after a refresh.
#   2. Asset caching — Vite emits content-hashed filenames in /assets/,
#      so they're safe to cache forever; the HTML shell stays no-cache.
#   3. Gzip — Vite assets are static so this gives ~70% transfer savings.
#   4. Basic security headers — frame-deny, no-sniff, referrer policy.

server {
    listen       80;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Asset caching: long for hashed files, never for the shell ---
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # --- API reverse proxy: forward /api/* to the backend container ---
    # Keeps the browser on the same origin (no mixed-content, no CORS issues).
    location /api/ {
        proxy_pass http://csm-workbench-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- SPA fallback: every unmatched route → index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Security headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Gzip for text-y assets ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- Health check for the container orchestrator ---
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
