# Production-shape docker compose — deploy Beroe AWB end-to-end on a
# single host. Five services:
#
#   web      — nginx serving the Vite SPA bundle (port 80)
#   api      — FastAPI on uvicorn (port 8000, behind nginx if you front it)
#   worker   — Celery worker for AI summarisation + extraction jobs
#   redis    — Celery broker + result backend
#   (NO postgres) — production DB lives on Supabase / managed Postgres;
#                   point DATABASE_URL at it via the .env file.
#
# Usage:
#   1. Copy .env.prod.example → .env.prod and fill the secrets.
#   2. Build:  docker compose -f docker-compose.prod.yml --env-file .env.prod build
#   3. Run:    docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   4. Migrate DB once after first deploy (see DEPLOY.md).
#
# Replace `image:` tags below with your registry (ECR / ACR / GCR) for
# multi-node deployments.

services:

  # -------------------- Web (Vite SPA + nginx) --------------------
  csm-workbench-frontend:
    image: 857862908450.dkr.ecr.eu-north-1.amazonaws.com/csm-account-workbench:beroe-awb-web-qa-1.0.0
    container_name: csm-workbench-frontend
    restart: on-failure
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      csm-workbench-backend:
        condition: service_healthy

  # -------------------- API (FastAPI + uvicorn) --------------------
  csm-workbench-backend:
    image: 857862908450.dkr.ecr.eu-north-1.amazonaws.com/csm-account-workbench:beroe-awb-api-qa-1.0.0
    container_name: csm-workbench-backend
    restart: on-failure
    env_file:
      - .env.prod
    environment:
      ENV: production
      # Override container-side Redis URL (api talks to the redis service
      # below by container name, not localhost).
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    command: sh -c ".venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  # -------------------- Celery worker --------------------
  csm-workbench-worker:
    image: 857862908450.dkr.ecr.eu-north-1.amazonaws.com/csm-account-workbench:beroe-awb-api-qa-1.0.0
    container_name: csm-workbench-worker
    restart: on-failure
    env_file:
      - .env.prod
    environment:
      ENV: production
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      csm-workbench-backend:
        condition: service_healthy
    command: sh -c ".venv/bin/celery -A app.workers.celery_app worker --loglevel=info --concurrency=2"

  # -------------------- Redis (broker + backend) --------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed publicly — only the api + worker containers reach it.
    # ports: []   ← intentionally omitted

volumes:
  redis_data:
