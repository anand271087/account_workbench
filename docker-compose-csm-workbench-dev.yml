# Production-shape docker compose — deploy Beroe AWB end-to-end on a
# single host. Five services:
#
#   web      — nginx serving the Vite SPA bundle (port 80)
#   api      — FastAPI on uvicorn (port 8000, behind nginx if you front it)
#   worker   — Celery worker for AI summarisation + extraction jobs
#   redis    — Celery broker + result backend
#   (NO postgres) — production DB lives on Supabase / managed Postgres;
#                   point DATABASE_URL at it via the .env file.
#
# Usage:
#   1. Copy .env.prod.example → .env.prod and fill the secrets.
#   2. Build:  docker compose -f docker-compose.prod.yml --env-file .env.prod build
#   3. Run:    docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   4. Migrate DB once after first deploy (see DEPLOY.md).
#
# Replace `image:` tags below with your registry (ECR / ACR / GCR) for
# multi-node deployments.

services:

  # -------------------- Web (Vite SPA + nginx) --------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Vite bakes these into the bundle at build time. Reads from the
        # .env.prod env file passed to `docker compose`.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: beroe-awb-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  # -------------------- API (FastAPI + uvicorn) --------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: beroe-awb-api:latest
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      ENV: production
      # Override container-side Redis URL (api talks to the redis service
      # below by container name, not localhost).
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  # -------------------- Celery worker --------------------
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: beroe-awb-api:latest
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      ENV: production
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  # -------------------- Redis (broker + backend) --------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed publicly — only the api + worker containers reach it.
    # ports: []   ← intentionally omitted

volumes:
  redis_data:
